# ROBOT TEMPLATES
.tb3_template: &tb3_template
  z: 0.01
  hazard_zone:
    x_min: 1.0
    x_max: 4.0
    fault: 'mobility_penalty'
  custom_bridges:
    - '/model/{name}/cmd_vel@geometry_msgs/msg/Twist]ignition.msgs.Twist'
  custom_remaps:
    - '/model/{name}/cmd_vel:=cmd_vel'

.jethexa_template: &jethexa_template
  z: 0.20
  extra_nodes:
    - package: 'chroma_simulation'
      executable: 'jethexa_gait.py'
  hazard_zone:
    x_min: -4.0
    x_max: -1.0
    fault: 'mobility_penalty'
  custom_bridges:
    - '/model/{name}/camera@sensor_msgs/msg/Image[ignition.msgs.Image'
    - '/model/{name}/camera_info@sensor_msgs/msg/CameraInfo[ignition.msgs.CameraInfo'
    - '/model/{name}/joint/head_pan_joint/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/head_tilt_joint/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/coxa_joint_LF/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/coxa_joint_LM/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/coxa_joint_LR/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/coxa_joint_RF/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/coxa_joint_RM/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/coxa_joint_RR/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/femur_joint_LF/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/femur_joint_LM/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/femur_joint_LR/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/femur_joint_RF/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/femur_joint_RM/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/femur_joint_RR/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/tibia_joint_LF/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/tibia_joint_LM/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/tibia_joint_LR/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/tibia_joint_RF/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/tibia_joint_RM/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
    - '/model/{name}/joint/tibia_joint_RR/cmd_pos@std_msgs/msg/Float64]ignition.msgs.Double'
  custom_remaps:
    - '/model/{name}/camera:=camera/image_raw'
    - '/model/{name}/camera_info:=camera/camera_info'
    - '/model/{name}/joint/head_pan_joint/cmd_pos:=joint/head_pan_joint/cmd_pos'
    - '/model/{name}/joint/head_tilt_joint/cmd_pos:=joint/head_tilt_joint/cmd_pos'
    - '/model/{name}/joint/coxa_joint_LF/cmd_pos:=joint/coxa_joint_LF/cmd_pos'
    - '/model/{name}/joint/coxa_joint_LM/cmd_pos:=joint/coxa_joint_LM/cmd_pos'
    - '/model/{name}/joint/coxa_joint_LR/cmd_pos:=joint/coxa_joint_LR/cmd_pos'
    - '/model/{name}/joint/coxa_joint_RF/cmd_pos:=joint/coxa_joint_RF/cmd_pos'
    - '/model/{name}/joint/coxa_joint_RM/cmd_pos:=joint/coxa_joint_RM/cmd_pos'
    - '/model/{name}/joint/coxa_joint_RR/cmd_pos:=joint/coxa_joint_RR/cmd_pos'
    - '/model/{name}/joint/femur_joint_LF/cmd_pos:=joint/femur_joint_LF/cmd_pos'
    - '/model/{name}/joint/femur_joint_LM/cmd_pos:=joint/femur_joint_LM/cmd_pos'
    - '/model/{name}/joint/femur_joint_LR/cmd_pos:=joint/femur_joint_LR/cmd_pos'
    - '/model/{name}/joint/femur_joint_RF/cmd_pos:=joint/femur_joint_RF/cmd_pos'
    - '/model/{name}/joint/femur_joint_RM/cmd_pos:=joint/femur_joint_RM/cmd_pos'
    - '/model/{name}/joint/femur_joint_RR/cmd_pos:=joint/femur_joint_RR/cmd_pos'
    - '/model/{name}/joint/tibia_joint_LF/cmd_pos:=joint/tibia_joint_LF/cmd_pos'
    - '/model/{name}/joint/tibia_joint_LM/cmd_pos:=joint/tibia_joint_LM/cmd_pos'
    - '/model/{name}/joint/tibia_joint_LR/cmd_pos:=joint/tibia_joint_LR/cmd_pos'
    - '/model/{name}/joint/tibia_joint_RF/cmd_pos:=joint/tibia_joint_RF/cmd_pos'
    - '/model/{name}/joint/tibia_joint_RM/cmd_pos:=joint/tibia_joint_RM/cmd_pos'
    - '/model/{name}/joint/tibia_joint_RR/cmd_pos:=joint/tibia_joint_RR/cmd_pos'

# SWARM DEPLOYMENT
swarm:
  tb3_1:
    <<: *tb3_template
    urdf: 'turtlebot3/robot.urdf.xacro'
    config: 'tb3_sim_profile.yaml'
    x: 0.0
    y: 0.0
    yaw: 0.0

