controller_server:
  ros__parameters:
    FollowPath:
      max_vel_x: 0.6
      min_vel_x: 0.0
      max_speed_xy: 0.6
      max_vel_theta: 1.2
      acc_lim_x: 1.0
      decel_lim_x: -1.0
      acc_lim_theta: 1.5
      decel_lim_theta: -1.5

local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.25

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.25

behavior_server:
  ros__parameters:
    max_rotational_vel: 1.2
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

velocity_smoother:
  ros__parameters:
    max_velocity: [0.6, 0.0, 1.2]
    min_velocity: [-0.6, 0.0, -1.2]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]