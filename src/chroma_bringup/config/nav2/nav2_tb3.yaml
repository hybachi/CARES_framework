controller_server:
  ros__parameters:
    FollowPath:
      max_vel_x: 0.22
      min_vel_x: 0.0
      max_speed_xy: 0.22
      max_vel_theta: 1.0
      acc_lim_x: 2.5
      decel_lim_x: -2.5
      acc_lim_theta: 3.2
      decel_lim_theta: -3.2

local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.1

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.22

behavior_server:
  ros__parameters:
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    max_velocity: [0.22, 0.0, 1.0]
    min_velocity: [-0.22, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]