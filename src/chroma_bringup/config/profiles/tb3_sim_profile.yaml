/**:
  ros__parameters:
    robot_type: 'UGV_WHEELED'
    model_name: 'turtlebot3_burger'

    capabilities:
      MOBILITY: 0.6
      PERCEPTION: 0.6
      BATTERY: 1.0
      PAYLOAD: 0.4

    thresholds:
      MOBILITY: 0.4
      PERCEPTION: 0.4
      BATTERY: 0.15

    fault_impacts:
      mobility_failure: 0.0
      PERCEPTION_failure: 0.1
      battery_failure: 0.0

      mobility_penalty: 0.3

    nav2:
      enabled: true
      use_sim_time: true
      map_yaml: 'usar_map.yaml'
      params_file: 'nav2_tb3.yaml'
      initial_pose:
        x: 0.0
        y: 0.0
        yaw_degrees: 0.0

    telemetry:
      has_battery: false
      drain_rate_idle: 0.0005
      drain_rate_active: 0.002

      watchdogs:
        topics: ['odom', 'scan']
        types: ['nav_msgs.msg.Odometry', 'sensor_msgs.msg.LaserScan']
        capabilities: ['MOBILITY', 'PERCEPTION']
        reliability: ['reliable', 'best_effort']
        timeouts: [2.0, 2.0]
