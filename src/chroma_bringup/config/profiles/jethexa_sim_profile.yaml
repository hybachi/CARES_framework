/**:
  ros__parameters:
    robot_type: 'UGV_LEGGED'
    model_name: 'jethexa'

    capabilities:
      MOBILITY: 0.8
      PERCEPTION: 0.8
      BATTERY: 1.0
      PAYLOAD: 0.7

    thresholds:
      MOBILITY: 0.3
      PERCEPTION: 0.2
      BATTERY: 0.2

    # Assigns cap = base * fault
    fault_impacts:
      mobility_failure: 0.3
      perception_failure: 0.2
      battery_failure: 0.0

      mobility_penalty: 0.6

    nav2:
      enabled: true
      use_sim_time: true
      map_yaml: 'usar_map.yaml'
      params_file: 'nav2_jethexa.yaml'
      initial_pose:
        x: 0.0
        y: 0.0
        yaw_degrees: 0.0

    telemetry:
      has_battery: false
      drain_rate_idle: 0.0005
      drain_rate_active: 0.002

      watchdogs:
        topics: ['odom', 'scan']
        types: ['nav_msgs.msg.Odometry', 'sensor_msgs.msg.LaserScan']
        capabilities: ['MOBILITY', 'PERCEPTION']
        reliability: ['reliable', 'best_effort']
        timeouts: [2.0, 2.0]
