[workspace]
authors = ["Hiba Anwar <hiba2anwar@gmail.com>"]
channels = ["https://prefix.dev/robostack-humble", "https://prefix.dev/conda-forge"]
name = "cares_ws"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "colcon build"
sim = "ros2 launch cares_simulation single_tb3.launch.py"

[activation]
scripts = ["install/setup.sh"]

[dependencies]
ros-humble-desktop = ">=0.10.0,<0.11"
colcon-common-extensions = ">=0.3.0,<0.4"
setuptools = "<=58.2.0"
ros-humble-ament-cmake-auto = ">=1.3.12,<2"
compilers = ">=1.11.0,<2"
pkg-config = ">=0.29.2,<0.30"
cmake = "<4"
ros-humble-ros-gz-sim = ">=0.244.20,<0.245"
ros-humble-ros-ign-bridge = ">=0.244.20,<0.245"
nicegui = ">=3.10.0,<4"
plotly = ">=6.6.0,<7"
